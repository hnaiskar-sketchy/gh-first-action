name: myfirst workflow

"on":
  push:

jobs:
  job1:
    name: job1
    runs-on: ubuntu-latest

    steps:
      - name: Running single command in job1
        run: echo "Hi, this is my first GitHub workflow"

      - name: Checking OS release for GitHub hosted runner
        run: cat /etc/os-release

      - name: Calling sleep
        run: sleep 20

  job2:
    name: job2
    runs-on: ubuntu-latest

    steps:
      - name: Checking hostname for runner
        run: hostname

      - name: Running multiple commands
        run: |
          echo "Hi from Harshad"
          echo "Current time and date"
          date
          sleep 20
